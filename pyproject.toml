[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"] # list of folders that contain the packages (["."] by default)

[project]
name = "vietlott-data"
version = "0.2.6"
description = "Vietlott Analytics — crawl, analyze, and suggest numbers for the Vietnamese lottery"
authors = [{ name = "Duc Hai", email = "duchai4320@gmail.com" }]
dependencies = [
    "bs4",
    "polars",
    "pyarrow",
    "lxml",
    "attrs",
    "cattrs",
    "click",
    "pendulum",
    "requests",
    "tabulate",
    "loguru",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/Hai4320/vietlot-suggestion"
Issues = "https://github.com/Hai4320/vietlot-suggestion/issues"


[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "setuptools", "wheel", "twine", "pre-commit"]
ml = ["numpy", "scikit-learn", "matplotlib", "pandas", "hmmlearn"]

[project.scripts]
vietlott-crawl = "vietlott.cli.crawl:crawl"
vietlott-missing = "vietlott.cli.missing:detect_missing_data"
vietlott-suggest = "vietlott.cli.suggest:suggest"
vietlott-check-rate = "vietlott.cli.check_rate:check_rate"
vietlott-budget = "vietlott.cli.budget:budget"

[tool.ruff]
line-length = 120
